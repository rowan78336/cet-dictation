<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CET 词汇听写训练应用</title>
    <!-- 引入 JetBrains Mono 字体，营造极客暗色代码风格 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #2ea043;
            --accent-red: #da3633;
            --accent-yellow: #d29922;
            --hover-bg: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-blue);
            letter-spacing: -0.5px;
        }

        .nav-btns {
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--hover-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--border-color);
            border-color: var(--text-muted);
        }

        button.primary {
            background: var(--accent-blue);
            color: #000;
            font-weight: 700;
            border: none;
        }

        button.primary:hover {
            opacity: 0.9;
        }

        main {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        /* 首页网格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .chapter-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .chapter-card:hover {
            border-color: var(--accent-blue);
        }

        .chapter-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .chapter-info {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* 听写测试区 */
        .dictation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .word-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .word-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .word-item input {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .word-item input:focus {
            border-color: var(--accent-blue);
        }

        /* 结果展示与错词本 */
        .result-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .result-item.correct { border-left: 4px solid var(--accent-green); }
        .result-item.wrong { border-left: 4px solid var(--accent-red); }

        .clickable-word {
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: underline;
        }
        .clickable-word:hover {
            opacity: 0.8;
        }

        .hidden { display: none !important; }
        
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">CET 词汇听写训练</h1>
        <div class="nav-btns">
            <button onclick="switchTab('home')">首页/章节</button>
            <button onclick="switchTab('wrong')">错词本</button>
            <button onclick="switchTab('import')">导入数据</button>
        </div>
    </header>

    <main>
        <!-- 首页：词库与章节选择 -->
        <section id="view-home" class="card">
            <div class="toolbar" style="margin-bottom: 20px; justify-content: space-between;">
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-muted); margin-right: 10px;">选择词库：</label>
                    <select id="dict-select" onchange="changeDictionary()">
                        <option value="cet4">英语四级词汇 (CET-4)</option>
                        <option value="cet6">英语六级词汇 (CET-6)</option>
                    </select>
                </div>
                <button class="primary" onclick="startRandomTest(50)">随机测试 50 个词</button>
            </div>
            <div id="chapter-grid" class="grid-container">
                <!-- 动态渲染章节 -->
            </div>
        </section>

        <!-- 听写测试界面 -->
        <section id="view-dictation" class="card hidden">
            <div class="dictation-header">
                <div>
                    <h2 id="dictation-title" style="font-size: 1rem; margin-bottom: 4px;">章节听写</h2>
                    <span id="dictation-progress" style="font-size: 0.8rem; color: var(--text-muted);">共 50 词</span>
                </div>
                <div class="toolbar">
                    <button onclick="playCurrentAudioBatch()">🔊 播放音频</button>
                    <button class="primary" onclick="submitDictation()">交卷批改</button>
                </div>
            </div>
            <div id="word-grid" class="word-grid">
                <!-- 动态渲染输入框 -->
            </div>
        </section>

        <!-- 成绩批改结果界面 -->
        <section id="view-result" class="card hidden">
            <div class="dictation-header">
                <div>
                    <h2>听写结果评测</h2>
                    <p id="result-score-text" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;"></p>
                </div>
                <button class="primary" onclick="switchTab('home')">返回首页</button>
            </div>
            <div id="result-list" class="result-box">
                <!-- 动态渲染批改详情 -->
            </div>
        </section>

        <!-- 错词本界面 -->
        <section id="view-wrong" class="card hidden">
            <div class="dictation-header">
                <h2>错词本 (点击单词即可发音重读)</h2>
                <button class="primary" onclick="startWrongTest()">重练错词</button>
            </div>
            <div id="wrong-list" class="result-box">
                <!-- 动态渲染错词 -->
            </div>
        </section>

        <!-- 导入/迁移数据界面 -->
        <section id="view-import" class="card hidden">
            <div class="dictation-header">
                <h2>数据管理与导入</h2>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">
                您可以将您的单词数据或迁移数据粘贴到下方 JSON 输入框中进行导入。
            </p>
            <textarea id="import-json" style="width: 100%; height: 200px; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; font-size: 0.85rem; margin-bottom: 15px;" placeholder="在此粘贴 JSON 数据..."></textarea>
            <button class="primary" onclick="handleDataImport()">确认导入</button>
        </section>
    </main>

    <script>
        // 核心内置简易词库模拟数据（四六级各按 50 个一组划分）
        const rawDatabase = {
            cet4: [
                {en: "abandon", cn: "放弃，抛弃"}, {en: "ability", cn: "能力，才能"}, {en: "absolute", cn: "绝对的，完全的"}, {en: "absorb", cn: "吸收，吸引"}, {en: "abstract", cn: "抽象的"},
                {en: "academic", cn: "学术的，学院的"}, {en: "accelerate", cn: "加速，促进"}, {en: "accent", cn: "口音，重音"}, {en: "access", cn: "入口，接近"}, {en: "accident", cn: "意外事件，事故"},
                {en: "accompany", cn: "陪伴，伴随"}, {en: "accomplish", cn: "完成，达到"}, {en: "accurate", cn: "准确的，精确的"}, {en: "accuse", cn: "指责，控告"}, {en: "accustom", cn: "使习惯"},
                {en: "achieve", cn: "实现，取得"}, {en: "acid", cn: "酸的，酸"}, {en: "acknowledge", cn: "承认，致谢"}, {en: "acquire", cn: "取得，获得"}, {en: "active", cn: "积极的，主动的"},
                {en: "adapt", cn: "适应，改编"}, {en: "add", cn: "添加，增加"}, {en: "adequate", cn: "足够的，恰当的"}, {en: "adjust", cn: "调整，调节"}, {en: "administration", cn: "管理，行政"},
                {en: "admire", cn: "钦佩，赞赏"}, {en: "admission", cn: "准许进入，入场费"}, {en: "admit", cn: "承认，准许入内"}, {en: "adopt", cn: "采纳，收养"}, {en: "adult", cn: "成年人"},
                {en: "advance", cn: "前进，进展"}, {en: "advantage", cn: "优势，利益"}, {en: "adventure", cn: "冒险，奇遇"}, {en: "advertise", cn: "登广告，宣传"}, {en: "advice", cn: "建议，忠告"},
                {en: "afford", cn: "负担得起，提供"}, {en: "agency", cn: "代理机构，办事处"}, {en: "agenda", cn: "议程，待办事项"}, {en: "agent", cn: "代理人，经纪人"}, {en: "aggressive", cn: "侵略的，进取的"},
                {en: "agreement", cn: "协定，同意"}, {en: "agriculture", cn: "农业，农艺"}, {en: "aid", cn: "援助，救护"}, {en: "aircraft", cn: "飞机，飞行器"}, {en: "airline", cn: "航空公司"},
                {en: "alarm", cn: "警报，惊恐"}, {en: "album", cn: "相册，唱片集"}, {en: "alcohol", cn: "酒精，含酒精饮料"}, {en: "alert", cn: "警惕的，警报"}, {en: "algebra", cn: "代数"}
            ],
            cet6: [
                {en: "banquet", cn: "宴会，盛宴"}, {en: "barren", cn: "贫瘠的，不毛的"}, {en: "barrier", cn: "屏障，障碍物"}, {en: "batch", cn: "一批，一炉"}, {en: "batter", cn: "连续猛击"},
                {en: "bazaar", cn: "集市，商店街"}, {en: "beak", cn: "鸟嘴，喙"}, {en: "beam", cn: "横梁，光束"}, {en: "beast", cn: "野兽，兽性"}, {en: "befit", cn: "适合，宜于"},
                {en: "begudge", cn: "吝惜，嫉妒"}, {en: "belie", cn: "掩饰，与...不符"}, {en: "belly", cn: "腹部，胃"}, {en: "benchmark", cn: "基准，标准"}, {en: "beneficiary", cn: "受益人"},
                {en: "benevolent", cn: "慈善的，仁慈的"}, {en: "bewilder", cn: "使迷惑，难住"}, {en: "bias", cn: "偏见，偏心"}, {en: "bicker", cn: "斗嘴，争吵"}, {en: "bid", cn: "出价，投标"},
                {en: "bizarre", cn: "奇异的，古怪的"}, {en: "blanch", cn: "漂白，吓白"}, {en: "blasphemy", cn: "亵渎，冒犯神明"}, {en: "bleak", cn: "阴冷的，荒凉的"}, {en: "blunder", cn: "大错，犯大错"},
                {en: "blunt", cn: "钝的，直率的"}, {en: "blur", cn: "使模糊，污迹"}, {en: "boast", cn: "自夸，夸耀"}, {en: "bogus", cn: "假的，伪造的"}, {en: "bolster", cn: "支持，垫子"},
                {en: "bolt", cn: "插销，闪电"}, {en: "bonda", cn: "契约，债券"}, {en: "bonus", cn: "奖金，红利"}, {en: "boom", cn: "繁荣，轰鸣"}, {en: "boost", cn: "推进，提高"},
                {en: "botanical", cn: "植物学的"}, {en: "boulder", cn: "巨石，漂砾"}, {en: "bouquet", cn: "花束，芳香"}, {en: "bourgeois", cn: "资产阶级的"}, {en: "boycott", cn: "联合抵制"},
                {en: "brace", cn: "支柱，撑起"}, {en: "brandish", cn: "挥舞，炫耀"}, {en: "breach", cn: "违背，破裂"}, {en: "breakthrough", cn: "突破"}, {en: "bribe", cn: "贿赂，行贿"},
                {en: "brink", cn: "边缘，毛口"}, {en: "brisk", cn: "敏捷的，兴隆的"}, {en: "bristle", cn: "发怒，短硬毛"}, {en: "brochure", cn: "小册子"}, {en: "bronze", cn: "青铜，青铜色"}
            ]
        };

        let currentDict = 'cet4';
        let currentWordList = [];
        let wrongWords = JSON.parse(localStorage.getItem('cet_wrong_words') || '[]');

        // 页面初始化
        window.onload = function() {
            renderChapters();
        };

        function switchTab(tabId) {
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById('view-' + tabId).classList.remove('hidden');
            if (tabId === 'home') renderChapters();
            if (tabId === 'wrong') renderWrongWords();
        }

        function changeDictionary() {
            currentDict = document.getElementById('dict-select').value;
            renderChapters();
        }

        // 渲染章节列表（每组调整为 50 个词）
        function renderChapters() {
            const container = document.getElementById('chapter-grid');
            container.innerHTML = '';
            const words = rawDatabase[currentDict];
            const pageSize = 50; // 改为每组 50 个
            const totalChapters = Math.ceil(words.length / pageSize);

            for (let i = 0; i < totalChapters; i++) {
                const start = i * pageSize;
                const end = Math.min((i + 1) * pageSize, words.length);
                const card = document.createElement('div');
                card.className = 'chapter-card';
                card.onclick = () => startChapterTest(start, end, `Chapter ${i + 1} (${start + 1}-${end})`);
                card.innerHTML = `
                    <div class="chapter-title">Chapter ${i + 1}</div>
                    <div class="chapter-info">包含词汇：第 ${start + 1} - ${end} 个单词</div>
                `;
                container.appendChild(card);
            }
        }

        function startChapterTest(start, end, titleName) {
            const words = rawDatabase[currentDict].slice(start, end);
            initDictation(words, titleName);
        }

        function startRandomTest(count) {
            const words = [...rawDatabase[currentDict]].sort(() => 0.5 - Math.random()).slice(0, count);
            initDictation(words, `随机测试 (${words.length} 词)`);
        }

        function startWrongTest() {
            if (wrongWords.length === 0) {
                alert('错词本为空，快去测试错词吧！');
                return;
            }
            initDictation([...wrongWords], `错词重练 (${wrongWords.length} 词)`);
        }

        function initDictation(words, title) {
            currentWordList = words;
            document.getElementById('dictation-title').innerText = title;
            document.getElementById('dictation-progress').innerText = `共 ${words.length} 词`;
            
            const grid = document.getElementById('word-grid');
            grid.innerHTML = '';

            words.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'word-item';
                div.innerHTML = `
                    <div class="word-meta">
                        <span>#${index + 1}</span>
                        <span>释义: ${item.cn}</span>
                    </div>
                    <input type="text" id="input-${index}" placeholder="请输入听到的英文单词..." autocomplete="off" onkeydown="handleKeyNav(event, ${index})">
                `;
                grid.appendChild(div);
            });

            switchTab('dictation');
            playCurrentAudioBatch();
        }

        // 按 Enter 快速跳到下一个输入框
        function handleKeyNav(event, index) {
            if (event.key === 'Enter') {
                const nextInput = document.getElementById(`input-${index + 1}`);
                if (nextInput) {
                    nextInput.focus();
                } else {
                    submitDictation();
                }
            }
        }

        // 语音朗读功能
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止当前未读完的语音
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // 稍微放缓语速
                window.speechSynthesis.speak(utterance);
            }
        }

        function playCurrentAudioBatch() {
            let i = 0;
            function playNext() {
                if (i < currentWordList.length) {
                    speakWord(currentWordList[i].en);
                    i++;
                    setTimeout(playNext, 1500); // 每个单词间隔 1.5 秒
                }
            }
            playNext();
        }

        // 批改并提交试卷
        function submitDictation() {
            let correctCount = 0;
            const resultList = document.getElementById('result-list');
            resultList.innerHTML = '';

            currentWordList.forEach((item, index) => {
                const userInput = (document.getElementById(`input-${index}`).value || '').trim().toLowerCase();
                const isCorrect = userInput === item.en.toLowerCase();
                
                if (isCorrect) {
                    correctCount++;
                    // 如果在错词本中，答对后可选择移除（此处保留或按需处理）
                } else {
                    // 加入错词本（去重）
                    if (!wrongWords.some(w => w.en === item.en)) {
                        wrongWords.push(item);
                    }
                }

                const resItem = document.createElement('div');
                resItem.className = `result-item ${isCorrect ? 'correct' : 'wrong'}`;
                resItem.innerHTML = `
                    <div>
                        <strong>正确答案:</strong> <span class="clickable-word" onclick="speakWord('${item.en}')" title="点击重读">${item.en}</span> (${item.cn})<br>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">你的输入: ${userInput || '(未填写)'}</span>
                    </div>
                    <div>${isCorrect ? '✅ 正确' : '❌ 错误'}</div>
                `;
                resultList.appendChild(resItem);
            });

            localStorage.setItem('cet_wrong_words', JSON.stringify(wrongWords));

            const scorePercent = Math.round((correctCount / currentWordList.length) * 100);
            document.getElementById('result-score-text').innerText = `正确率: ${scorePercent}% (${correctCount}/${currentWordList.length})`;

            switchTab('result');
        }

        // 渲染错词本（支持点击单词重读）
        function renderWrongWords() {
            const container = document.getElementById('wrong-list');
            container.innerHTML = '';

            if (wrongWords.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">太棒了，错词本空空如也！</div>';
                return;
            }

            wrongWords.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'result-item wrong';
                div.innerHTML = `
                    <div>
                        <strong>单词:</strong> <span class="clickable-word" onclick="speakWord('${item.en}')" title="点击重读">${item.en}</span> 
                        <span style="font-size: 0.85rem; color: var(--text-muted); margin-left: 10px;">${item.cn}</span>
                    </div>
                    <button onclick="removeWrongWord(${index})" style="font-size: 0.75rem; padding: 2px 6px;">移出</button>
                `;
                container.appendChild(div);
            });
        }

        function removeWrongWord(index) {
            wrongWords.splice(index, 1);
            localStorage.setItem('cet_wrong_words', JSON.stringify(wrongWords));
            renderWrongWords();
        }

        function handleDataImport() {
            try {
                const text = document.getElementById('import-json').value;
                const data = JSON.parse(text);
                if (Array.isArray(data)) {
                    wrongWords = data;
                    localStorage.setItem('cet_wrong_words', JSON.stringify(wrongWords));
                    alert('导入错词成功！');
                    switchTab('wrong');
                } else {
                    alert('格式不正确，请输入标准的单词数组 JSON');
                }
            } catch(e) {
                alert('解析 JSON 失败，请检查输入格式。');
            }
        }
    </script>
</body>
</html>
